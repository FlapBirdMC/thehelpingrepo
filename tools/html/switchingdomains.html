<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[NAME] is moving</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --navy:#030712; --blue:#93c5fd; --line:rgba(59,130,246,.2); --glass:rgba(15,23,42,.7); --hover:rgba(30,58,138,.8); }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Space Grotesk',sans-serif; }
        html, body { height:100%; }
        body {
            background:
                radial-gradient(60vmax 40vmax at 15% 10%, rgba(37,99,235,.35), transparent 70%),
                radial-gradient(50vmax 35vmax at 90% 100%, rgba(249,115,22,.22), transparent 70%),
                var(--navy);
            color:#f1f5f9;
            display:flex; justify-content:center; align-items:center;
            padding:16px;
        }
        .card {
            width:min(460px,100%);
            text-align:center;
            background:var(--glass);
            border:1px solid var(--line);
            border-radius:12px;
            padding:34px 24px 26px;
            backdrop-filter:blur(10px);
            -webkit-backdrop-filter:blur(10px);
        }
        .avatar { width:84px; height:84px; border-radius:50%; object-fit:cover; border:2px solid rgba(59,130,246,.4); margin-bottom:14px; }
        .pill { display:inline-block; font-size:11px; letter-spacing:.14em; color:var(--blue); border:1px solid var(--line); border-radius:999px; padding:4px 12px; margin-bottom:14px; }
        h1 { font-size:clamp(1.8rem,7vw,2.4rem); font-weight:700; letter-spacing:-.02em; margin-bottom:18px; }
        .move { display:flex; flex-direction:column; align-items:center; gap:6px; margin-bottom:18px; }
        .old { color:#94a3b8; text-decoration:line-through; font-size:14px; word-break:break-all; }
        .arrow { color:var(--blue); font-size:20px; line-height:1; }
        .new { color:#fff; font-size:clamp(1.3rem,6vw,1.7rem); font-weight:700; }
        .new span { color:var(--blue); }
        .note { color:#cbd5e1; font-size:14px; margin-bottom:22px; }
        .note em { color:var(--blue); font-style:normal; }
        .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
        .btn { display:inline-block; background:var(--glass); border:1px solid var(--line); padding:10px 16px; border-radius:6px; color:#e2e8f0; text-decoration:none; font-size:14px; font-weight:600; transition:all .15s ease; }
        .btn:hover { background:var(--hover); border-color:rgba(96,165,250,.5); color:#fff; }
        .btn.primary { background:rgba(37,99,235,.75); border-color:rgba(147,197,253,.5); }
    </style>
</head>
<body>
    <main class="card">
        <img class="avatar" src="avatar.jfif" alt="[NAME]" onerror="this.style.display='none'">
        <div><span class="pill">heads up</span></div>
        <h1>we're moving</h1>

        <div class="move">
            <div class="old">[OLD_DOMAIN]</div>
            <div class="arrow">↓</div>
            <div class="new">[NAME]<span>.win</span></div>
        </div>

        <p class="note">the site is moving to <b>[NAME].win</b> for about a year <em>(well, maybe)</em>.</p>

        <div class="btns">
            <a class="btn primary" href="https://[NAME].win">go to [NAME].win</a>
            <a class="btn" href="https://discord.gg/example" target="_blank" rel="noopener">join the discord</a>
        </div>
    </main>
</body>
</html>
